; net0 firmware — one env per physical board.
; Per-board settings live ONLY here (build_flags), never in .cpp files.
;   NODE_ID   : this board's ID (0 = gateway, 1-5 = nodes)
;   NEIGHBORS : comma list of last_hop IDs we accept packets from ("0" = anyone)
; Gateway is ID 0 (it never transmits, so no NEIGHBORS list ever needs to name it).
; Every non-gateway node is BOTH an access node (Wi-Fi AP "NET0-<id>") and a relay.
;
; Current topology (3 boards, a line so reports visibly hop):
;   node2  →  node1  →  gateway(0)
; To make everyone hear everyone directly, set all NEIGHBORS to "0".

[platformio]
default_envs = gateway, node1, node2, node3, node4, node5

[env]
; pioarduino = Arduino-ESP32 core 3.x (ESP-NOW v2). Do NOT use `platform = espressif32`.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[node_base]
build_src_filter = +<node/>

[gateway_base]
build_src_filter = +<gateway/>
; Wi-Fi + Bluetooth doesn't fit the default 1.3 MB app slot; huge_app = 3 MB (no OTA).
board_build.partitions = huge_app.csv

; ---------- active boards ----------
[env:gateway]
extends = gateway_base
build_flags = -D NODE_ID=0 '-D NEIGHBORS="1"'

[env:node1]
extends = node_base
build_flags = -D NODE_ID=1 '-D NEIGHBORS="2"'

[env:node2]
extends = node_base
build_flags = -D NODE_ID=2 '-D NEIGHBORS="1"'

; ---------- spares (not in the topology yet) ----------
[env:node3]
extends = node_base
build_flags = -D NODE_ID=3 '-D NEIGHBORS="0"'

[env:node4]
extends = node_base
build_flags = -D NODE_ID=4 '-D NEIGHBORS="0"'

[env:node5]
extends = node_base
build_flags = -D NODE_ID=5 '-D NEIGHBORS="0"'
